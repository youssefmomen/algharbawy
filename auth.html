<body data-page="auth">
<main class="auth-wrap"><div class="wrap" style="display:flex;justify-content:center">
  <div class="auth-card rv">
    <div class="page-mark" style="margin-bottom:28px"><span class="mark"><i>غ</i></span></div>
    <h1 id="auth-title">تسجيل الدخول</h1>
    <p class="sub" id="auth-sub">سجّل دخولك ليُحفَظ تقدّمك في الدروس على حسابك.</p>
    <div class="tabs"><button type="button" id="tab-in" class="on">دخول</button><button type="button" id="tab-up">حساب جديد</button></div>
    <form id="auth-form" novalidate>
      <div class="field"><label for="f-email">البريد الإلكتروني</label><input type="email" id="f-email" autocomplete="email" dir="ltr" required></div>
      <div class="field"><label for="f-pass">كلمة المرور</label><input type="password" id="f-pass" autocomplete="current-password" dir="ltr" minlength="6" required></div>
      <div class="form-err" id="auth-err" role="alert"></div>
      <button class="btn fill block" id="auth-go" type="submit">دخول</button>
    </form>
    <div class="divider">أو</div>
    <button class="btn ghost block" id="auth-google" type="button">الدخول بحساب جوجل</button>
  </div>
</div></main>
<footer id="footer"></footer>
