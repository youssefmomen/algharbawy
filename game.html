<body data-page="game">
<main class="wrap">
  <div class="adm-note" id="g-gate" hidden></div>

  <div class="auth-card" id="g-intro" hidden>
    <h2 id="g-title"></h2>
    <p class="sub" id="g-desc"></p>
    <p class="t-meta" id="g-info"></p>
    <button class="btn fill block" id="g-start" type="button">ابدأ اللعب</button>
  </div>

  <!-- سباق -->
  <div id="g-race" hidden>
    <div class="race-track">
      <div class="race-lane"><span class="race-name">أنت</span><span class="race-runner" id="race-me">🐎</span></div>
      <div class="race-lane"><span class="race-name">المنافس</span><span class="race-runner race-bot" id="race-bot">🐪</span></div>
      <div class="race-flag">🏁</div>
    </div>
    <div class="x-q" id="race-q"></div>
  </div>

  <!-- تحدي السرعة -->
  <div id="g-quiz" hidden>
    <div class="x-hud"><span id="quiz-score"></span><span class="x-timer" id="quiz-timer"></span></div>
    <div class="x-q" id="quiz-q"></div>
  </div>

  <div class="auth-card" id="g-done" hidden>
    <h2 id="g-result-title"></h2>
    <p class="x-score" id="g-score"></p>
    <p class="sub">ستظهر نتيجتك عند معلمك.</p>
    <div class="t-acts-col">
      <button class="btn fill block" id="g-again" type="button">العب مرة أخرى</button>
      <a class="btn ghost block" href="student.html">عودة إلى الاختبارات والألعاب</a>
    </div>
  </div>
</main>
<footer id="footer"></footer>

</body>
