<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التاريخ الوطني — البكالوريا المصرية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background:#eef6f7;color:#123;min-height:100vh}
header{background:linear-gradient(135deg,#0e5fa8,#1580c4);color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(14,95,168,.25)}
.crumbs{font-size:11px;opacity:.85;margin-bottom:6px;line-height:1.8}
h1{font-size:18px;font-weight:800;line-height:1.7}
.stage{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:11px;font-weight:700;border-radius:99px;padding:2px 10px;margin-top:8px}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ffd23f,#ffb703);border-radius:99px;transition:width .4s}
.pct{font-size:12px;font-weight:800}
.seg-label{display:flex;align-items:center;gap:8px;margin:16px 14px 8px;font-size:14px;font-weight:800;color:#0e5fa8}
.seg-label .n{min-width:26px;height:26px;border-radius:50%;background:#0e5fa8;color:#fff;display:grid;place-items:center;font-size:13px;padding:0 4px}
.card{background:#fff;border-radius:16px;margin:0 12px 14px;box-shadow:0 3px 10px rgba(10,60,100,.10);overflow:hidden;border:1.5px solid #d8ecf4}
.card .cap{padding:9px 14px 7px;font-size:13px;font-weight:800;color:#0e5fa8}
.card img{width:100%;display:block;cursor:zoom-in}
.q{background:#fff;border-radius:16px;margin:0 12px 14px;padding:14px;box-shadow:0 3px 10px rgba(10,60,100,.10);border:1.5px solid #d8ecf4}
.q .src{display:inline-block;font-size:10.5px;font-weight:700;color:#0e5fa8;background:#e3f1fa;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.q h3{font-size:14.5px;font-weight:800;line-height:2;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;font-family:inherit;font-size:14px;font-weight:700;color:#123;background:#f4fafc;border:2px solid #cfe6f0;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.opt .k{min-width:26px;height:26px;border-radius:8px;background:#0e5fa8;color:#fff;display:grid;place-items:center;font-size:13px}
.opt.ok{background:#e8f9e9;border-color:#2e9e4f}.opt.ok .k{background:#2e9e4f}
.opt.no{background:#fdecec;border-color:#d64545}.opt.no .k{background:#d64545}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:84px;border:2px solid #cfe6f0;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.9;resize:vertical;background:#f4fafc;color:#123}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-reveal{background:#fff3d6;color:#8a6d00;border:2px solid #ffd23f}
.btn-done{background:#e8f9e9;color:#1d7a38;border:2px solid #2e9e4f}
.ans{margin-top:10px;border:2px dashed #ffb703;border-radius:12px;overflow:hidden}
.ans .h{background:#fff7e3;color:#8a6d00;font-size:12px;font-weight:800;padding:8px 12px}
.ans img{width:100%;display:block}
.feed{font-size:13px;font-weight:800;margin-top:6px}
.feed.ok{color:#1d7a38}.feed.no{color:#c0392b}
.why{margin-top:10px}
.why summary{font-size:12px;font-weight:800;color:#0e5fa8;cursor:pointer}
.why img{width:100%;border-radius:10px;margin-top:6px;border:1.5px solid #d8ecf4}
.next{display:block;width:calc(100% - 24px);margin:6px 12px 10px;background:linear-gradient(135deg,#0e5fa8,#1580c4);color:#fff;border:0;border-radius:14px;padding:14px;font-family:inherit;font-size:16px;font-weight:800;box-shadow:0 4px 0 #0a4a82;cursor:pointer}
.next:disabled{background:#b8ccd8;box-shadow:0 4px 0 #93a9b5;cursor:not-allowed}
.lock{font-size:11px;color:#7a99aa;text-align:center;padding-bottom:14px}
.done-screen{text-align:center;padding:40px 20px}
.done-screen .big{font-size:56px}
.done-screen h2{font-size:22px;font-weight:900;color:#0e5fa8;margin:10px 0 6px}
.done-screen p{font-size:14px;color:#456;line-height:2}
footer{height:30px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%}
.zoom.on{display:flex}
.bk{font-size:16.5px;line-height:2;color:#20303d;padding:14px 16px}
.bk .rh{color:#d43d3d;font-weight:900;font-size:18px;margin:12px 0 6px}
.bk .mh{color:#b03060;font-weight:800;font-size:17px;margin:12px 0 6px}
.bk .bq{color:#1e6fb8;font-weight:700;font-size:16px;margin:10px 0 6px;line-height:1.9}
.bk .tx{margin:6px 0}
.bk .side{background:#fdf6e3;border:1px solid #f0e2b8;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.bk .side .sh{color:#d43d3d;display:block;font-size:15px;margin-bottom:4px;font-weight:800}
.bk .pill{display:inline-block;background:#2e9e5b;color:#fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:14.5px;margin:12px 0 4px}
.bk .pill.bl{background:#1e5aa8}.bk .pill.rd{background:#d43d3d}.bk .pill.tq{background:#0e7490}
.bk .pill.ol{background:#fff;color:#e07b00;border:2px solid #e07b00}
.bk .act{background:#f4f9ff;border:2px solid #bcd9f0;border-radius:14px;padding:10px 14px;margin:10px 0}
.bk .doc{border:2px solid;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;background:#fff}
.bk .doc h{font-size:14.5px;font-weight:900;margin-bottom:4px}
.bk .doc.g{border-color:#2e9e5b}.bk .doc.g h{color:#2e9e5b}
.bk .doc.b{border-color:#1e6fb8}.bk .doc.b h{color:#1e6fb8}
.bk .doc.m{border-color:#b03060}.bk .doc.m h{color:#b03060}
.bk .doc.o{border-color:#e07b00}.bk .doc.o h{color:#e07b00}
.bk .quote{background:#f6f1e7;border-radius:14px;padding:12px 16px;font-size:16.5px;margin:10px 0;border-right:4px solid #c9a84c}
.bk ul.dash{margin:4px 18px 4px 0;padding:0;list-style:none}
.bk ul.dash li{margin:6px 0}
.bk .num{color:#1e6fb8;font-weight:800}
.ans .bk{padding:10px 14px;font-size:15.5px}
</style></head><body>
<header>
  <div class="crumbs">المناهج الدراسية المصرية ◂ البكالوريا المصرية ◂ تانية ثانوي ◂ الجزء الأول ◂ التاريخ الوطني</div>
  <h1 id="L-title"></h1>
  <span class="stage" id="L-stage"></span>
  <div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><span class="pct" id="pct"></span></div>
</header>
<main id="main"></main>
<footer></footer>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img id="zoom-img"></div>
<script src="assets/data/25-bac-tarikh-g2p1.js?v=2"></script>
<script>
var D=window.BAC_G2P1,LES=D.lessons[0],STG=D.stages.filter(function(s){return s.id===LES.stage;})[0];
var IMG='assets/book/taw-g2p1/L1/',KEY='bac-g2p1-l1';
var S={seg:0,done:{}};
try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv&&typeof sv.seg==='number')S=sv;}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ar(n){return (''+n).replace(/\d/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[c];});}
document.getElementById('L-title').textContent=LES.title;
document.getElementById('L-stage').textContent='المرحلة '+ar(STG.n)+': '+STG.title;
function totalQ(){return LES.segments.reduce(function(a,s){return a+s.questions.length;},0);}
function doneQ(){var n=0;for(var k in S.done)n++;return n;}
function paint(){
  var pc=Math.round(doneQ()/totalQ()*100);
  document.getElementById('fill').style.width=pc+'%';
  document.getElementById('pct').textContent=ar(pc)+'٪';
}
function zoom(src){var z=document.getElementById('zoom');document.getElementById('zoom-img').src=src;z.classList.add('on');}
function explainHTML(list){
  return list.map(function(e){
    if(e.b)return '<div class="card bk">'+D.B[e.b]+'</div>';
    return '<div class="card">'+(e.cap?'<div class="cap">'+e.cap+'</div>':'')+'<img loading="lazy" src="'+IMG+e.img+'.jpg" onclick="zoom(this.src)" alt="من الكتاب"></div>';
  }).join('');
}
function refHTML(ref){
  if(ref&&ref.img)return '<img loading="lazy" src="'+IMG+ref.img+'.jpg" onclick="zoom(this.src)">';
  var arr=Array.isArray(ref)?ref:[ref];
  return '<div class="bk">'+arr.map(function(k){return D.B[k];}).join('')+'</div>';
}
function qHTML(q,idx){
  var id='q'+idx,done=S.done[id];
  var h='<div class="q" id="'+id+'"><span class="src">'+q.src+'</span><h3>'+q.q+'</h3>';
  if(q.t==='mcq'){
    var letters=['أ','ب','ج','د'];
    h+=q.options.map(function(o,i){
      var cls='opt';
      if(done&&i===q.a)cls+=' ok';
      if(done&&done.picked===i&&i!==q.a)cls+=' no';
      return '<button class="'+cls+'" data-q="'+idx+'" data-i="'+i+'" '+(done?'disabled':'')+'><span class="k">'+letters[i]+'</span> '+o+(done&&i===q.a?' ✓':'')+'</button>';
    }).join('');
    if(done){
      h+='<div class="feed ok">أحسنت! إجابة صحيحة ✓</div>';
      h+='<details class="why"><summary>📖 المرجع من الكتاب</summary>'+refHTML(q.why)+'</details>';
    }
  }else{
    if(!done){
      h+='<textarea id="ta'+idx+'" placeholder="اكتب إجابتك هنا أولًا…"></textarea>';
      h+='<button class="btn btn-reveal" data-rev="'+idx+'">🔍 اعرض الإجابة من الكتاب</button>';
      h+='<div class="ans" id="ans'+idx+'" hidden><div class="h">📖 الإجابة من الكتاب — قارنها بما كتبت</div>'+refHTML(q.ans)+'</div>';
      h+='<button class="btn btn-done" data-ok="'+idx+'" hidden id="ok'+idx+'">✓ راجعت إجابتي</button>';
    }else{
      h+='<div class="feed ok">تمت المراجعة ✓</div>';
      h+='<details class="why"><summary>📖 الإجابة من الكتاب</summary>'+refHTML(q.ans)+'</details>';
    }
  }
  return h+'</div>';
}
function render(){
  var m=document.getElementById('main');
  if(S.seg>=LES.segments.length){
    m.innerHTML='<div class="done-screen"><div class="big">🏆</div><h2>أحسنت! أنهيت الدرس الأول</h2><p>راجعت كل شرح الكتاب وأجبت على '+ar(totalQ())+' سؤالًا — كل أسئلة الدرس بدون استثناء.<br>الدرس التالي يُفتح بعد اعتماد المعلم.</p></div>';
    paint();window.scrollTo(0,0);return;
  }
  var sg=LES.segments[S.seg];
  var base=0;for(var i=0;i<S.seg;i++)base+=LES.segments[i].questions.length;
  var h='<div class="seg-label"><span class="n">'+ar(S.seg+1)+'/'+ar(LES.segments.length)+'</span> '+sg.label+'</div>';
  h+=explainHTML(sg.explain);
  h+=sg.questions.map(function(q,i){return qHTML(q,base+i);}).join('');
  var allDone=sg.questions.every(function(_,i){return S.done['q'+(base+i)];});
  h+='<button class="next" id="nextBtn" '+(allDone?'':'disabled')+'>التالي ◂</button>';
  h+='<div class="lock">'+(allDone?'':'🔒 أجب على كل الأسئلة لفتح الجزء التالي')+'</div>';
  m.innerHTML=h;paint();
  m.querySelectorAll('.opt').forEach(function(b){b.onclick=function(){
    var qi=+b.dataset.q,oi=+b.dataset.i,q=null,bb=0;
    LES.segments.forEach(function(s){s.questions.forEach(function(x,j){if(bb+j===qi)q=x;});bb+=s.questions.length;});
    S.done['q'+qi]={picked:oi};save();render();
    if(oi!==q.a){var el=document.getElementById('q'+qi);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});}
  };});
  m.querySelectorAll('[data-rev]').forEach(function(b){b.onclick=function(){
    var i=b.dataset.rev;
    document.getElementById('ans'+i).hidden=false;
    document.getElementById('ok'+i).hidden=false;
    b.hidden=true;
  };});
  m.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){
    var i=+b.dataset.ok;S.done['q'+i]={open:true};save();render();
  };});
  var nb=document.getElementById('nextBtn');
  if(nb)nb.onclick=function(){if(nb.disabled)return;S.seg++;save();render();window.scrollTo(0,0);};
}
render();
</script></body></html>
