<!doctype html><html dir="rtl" lang="ar"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>التاريخ الوطني — البكالوريا المصرية</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{font-family:'Cairo',sans-serif;background:#eef6f7;color:#123;min-height:100vh}
header{background:linear-gradient(135deg,#0e5fa8,#1580c4);color:#fff;padding:14px 16px 18px;border-radius:0 0 22px 22px;box-shadow:0 4px 14px rgba(14,95,168,.25)}
.crumbs{font-size:11px;opacity:.85;margin-bottom:6px;line-height:1.8}
h1{font-size:18px;font-weight:800;line-height:1.7}
.stage{display:inline-block;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.35);font-size:11px;font-weight:700;border-radius:99px;padding:2px 10px;margin-top:8px}
.prog{display:flex;align-items:center;gap:10px;margin-top:12px}
.bar{flex:1;height:12px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden}
.fill{height:100%;background:linear-gradient(90deg,#ffd23f,#ffb703);border-radius:99px;transition:width .4s}
.pct{font-size:12px;font-weight:800}
.seg-label{display:flex;align-items:center;gap:8px;margin:16px 14px 8px;font-size:14px;font-weight:800;color:#0e5fa8}
.seg-label .n{min-width:26px;height:26px;border-radius:50%;background:#0e5fa8;color:#fff;display:grid;place-items:center;font-size:13px;padding:0 4px}
.card{background:#fff;border-radius:16px;margin:0 12px 14px;box-shadow:0 3px 10px rgba(10,60,100,.10);overflow:hidden;border:1.5px solid #d8ecf4}
.card .cap{padding:9px 14px 7px;font-size:13px;font-weight:800;color:#0e5fa8}
.card img{width:100%;display:block;cursor:zoom-in}
.q{background:#fff;border-radius:16px;margin:0 12px 14px;padding:14px;box-shadow:0 3px 10px rgba(10,60,100,.10);border:1.5px solid #d8ecf4}
.q .src{display:inline-block;font-size:10.5px;font-weight:700;color:#0e5fa8;background:#e3f1fa;border-radius:99px;padding:2px 10px;margin-bottom:8px}
.q h3{font-size:14.5px;font-weight:800;line-height:2;margin-bottom:10px}
.opt{display:flex;align-items:center;gap:10px;width:100%;text-align:right;font-family:inherit;font-size:14px;font-weight:700;color:#123;background:#f4fafc;border:2px solid #cfe6f0;border-radius:12px;padding:11px 12px;margin-bottom:8px;cursor:pointer}
.opt .k{min-width:26px;height:26px;border-radius:8px;background:#0e5fa8;color:#fff;display:grid;place-items:center;font-size:13px}
.opt.ok{background:#e8f9e9;border-color:#2e9e4f}.opt.ok .k{background:#2e9e4f}
.opt.no{background:#fdecec;border-color:#d64545}.opt.no .k{background:#d64545}
.opt:disabled{cursor:default}
textarea{width:100%;min-height:84px;border:2px solid #cfe6f0;border-radius:12px;padding:10px 12px;font-family:inherit;font-size:14px;line-height:1.9;resize:vertical;background:#f4fafc;color:#123}
.btn{display:block;width:100%;border:0;border-radius:12px;padding:11px;font-family:inherit;font-size:14px;font-weight:800;cursor:pointer;margin-top:8px}
.btn-reveal{background:#fff3d6;color:#8a6d00;border:2px solid #ffd23f}
.btn-done{background:#e8f9e9;color:#1d7a38;border:2px solid #2e9e4f}
.ans{margin-top:10px;border:2px dashed #ffb703;border-radius:12px;overflow:hidden}
.ans .h{background:#fff7e3;color:#8a6d00;font-size:12px;font-weight:800;padding:8px 12px}
.ans img{width:100%;display:block}
.feed{font-size:13px;font-weight:800;margin-top:6px}
.feed.ok{color:#1d7a38}.feed.no{color:#c0392b}
.why{margin-top:10px}
.why summary{font-size:12px;font-weight:800;color:#0e5fa8;cursor:pointer}
.why img{width:100%;border-radius:10px;margin-top:6px;border:1.5px solid #d8ecf4}
.next{display:block;width:calc(100% - 24px);margin:6px 12px 10px;background:linear-gradient(135deg,#0e5fa8,#1580c4);color:#fff;border:0;border-radius:14px;padding:14px;font-family:inherit;font-size:16px;font-weight:800;box-shadow:0 4px 0 #0a4a82;cursor:pointer}
.next:disabled{background:#b8ccd8;box-shadow:0 4px 0 #93a9b5;cursor:not-allowed}
.lock{font-size:11px;color:#7a99aa;text-align:center;padding-bottom:14px}
.done-screen{text-align:center;padding:40px 20px}
.done-screen .big{font-size:56px}
.done-screen h2{font-size:22px;font-weight:900;color:#0e5fa8;margin:10px 0 6px}
.done-screen p{font-size:14px;color:#456;line-height:2}
footer{height:30px}
.zoom{position:fixed;inset:0;background:rgba(0,0,0,.9);display:none;align-items:center;justify-content:center;z-index:50;cursor:zoom-out}
.zoom img{max-width:100%;max-height:100%}
.zoom.on{display:flex}
.bk{font-size:16.5px;line-height:2;color:#20303d;padding:14px 16px}
.bk .rh{color:#d43d3d;font-weight:900;font-size:18px;margin:12px 0 6px}
.bk .mh{color:#b03060;font-weight:800;font-size:17px;margin:12px 0 6px}
.bk .bq{color:#1e6fb8;font-weight:700;font-size:16px;margin:10px 0 6px;line-height:1.9}
.bk .tx{margin:6px 0}
.bk .side{background:#fdf6e3;border:1px solid #f0e2b8;border-radius:12px;padding:10px 12px;margin:10px 0;font-size:15px}
.bk .side .sh{color:#d43d3d;display:block;font-size:15px;margin-bottom:4px;font-weight:800}
.bk .pill{display:inline-block;background:#2e9e5b;color:#fff;border-radius:99px;padding:3px 14px;font-weight:800;font-size:14.5px;margin:12px 0 4px}
.bk .pill.bl{background:#1e5aa8}.bk .pill.rd{background:#d43d3d}.bk .pill.tq{background:#0e7490}
.bk .pill.ol{background:#fff;color:#e07b00;border:2px solid #e07b00}
.bk .act{background:#f4f9ff;border:2px solid #bcd9f0;border-radius:14px;padding:10px 14px;margin:10px 0}
.bk .doc{border:2px solid;border-radius:12px;padding:10px 12px;margin:8px 0;font-size:15px;background:#fff}
.bk .doc h{font-size:14.5px;font-weight:900;margin-bottom:4px}
.bk .doc.g{border-color:#2e9e5b}.bk .doc.g h{color:#2e9e5b}
.bk .doc.b{border-color:#1e6fb8}.bk .doc.b h{color:#1e6fb8}
.bk .doc.m{border-color:#b03060}.bk .doc.m h{color:#b03060}
.bk .doc.o{border-color:#e07b00}.bk .doc.o h{color:#e07b00}
.bk .quote{background:#f6f1e7;border-radius:14px;padding:12px 16px;font-size:16.5px;margin:10px 0;border-right:4px solid #c9a84c}
.bk ul.dash{margin:4px 18px 4px 0;padding:0;list-style:none}
.bk ul.dash li{margin:6px 0}
.bk .num{color:#1e6fb8;font-weight:800}
.ans .bk{padding:10px 14px;font-size:15.5px}
.sec-h{margin:4px 14px 10px;font-size:15px;font-weight:900;color:#0e5fa8}
.navrow{display:flex;gap:10px;margin:6px 12px 10px}
.navrow .next{width:auto;flex:2;margin:0}
.prev{flex:1;background:#fff;color:#0e5fa8;border:2px solid #0e5fa8;border-radius:14px;padding:14px;font-family:inherit;font-size:16px;font-weight:800;box-shadow:0 4px 0 #b8ccd8;cursor:pointer}
.prev:disabled{opacity:.35;cursor:not-allowed;box-shadow:none}
.map{padding:22px 20px;display:flex;flex-direction:column;align-items:center;gap:2px}
.node{display:flex;flex-direction:column;align-items:center;gap:6px}
.circle{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:22px;font-weight:900;color:#fff;border:0;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.18);font-family:inherit}
.circle.done{background:#2e9e4f}
.circle.cur{background:linear-gradient(135deg,#ffb703,#ff9f1c);animation:pulse 1.6s infinite}
.circle.lock{background:#b8ccd8;cursor:not-allowed;font-size:20px}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.linkline{width:4px;height:14px;background:#cfe0ea;border-radius:2px}
.nlabel{font-size:11.5px;font-weight:800;color:#456;max-width:130px;text-align:center;line-height:1.6}
.overlay{position:fixed;inset:0;background:rgba(0,30,50,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
.pop{background:#fff;border-radius:4px;padding:0 0 4px;max-width:340px;text-align:right;overflow:hidden;box-shadow:0 10px 30px rgba(0,0,0,.25);border-top:4px solid #fa9005}
.pop .pop-h{display:flex;align-items:center;gap:10px;padding:14px 16px 6px;font-size:16.5px;font-weight:900;color:#1c3d5a;line-height:1.8}
.pop p{padding:4px 16px 12px;font-size:15px;font-weight:600;line-height:2;color:#333}
.pop .pop-btn{display:block;width:calc(100% - 32px);margin:6px 16px 12px;background:#1c3d5a;color:#fff;border:0;border-radius:4px;padding:12px;font-family:inherit;font-size:15px;font-weight:800;cursor:pointer}
</style></head><body>
<header>
  <div class="crumbs">المناهج الدراسية المصرية ◂ البكالوريا المصرية ◂ تانية ثانوي ◂ الجزء الأول ◂ التاريخ الوطني</div>
  <h1 id="L-title"></h1>
  <span class="stage" id="L-stage"></span>
  <div class="prog"><div class="bar"><div class="fill" id="fill"></div></div><span class="pct" id="pct"></span></div>
</header>
<main id="main"></main>
<footer></footer>
<div class="zoom" id="zoom" onclick="this.classList.remove('on')"><img id="zoom-img"></div>
<script src="assets/data/25-bac-tarikh-g2p1.js?v=4"></script>
<script>
var D=window.BAC_G2P1,LES=D.lessons[0],STG=D.stages.filter(function(s){return s.id===LES.stage;})[0];
var IMG='assets/book/taw-g2p1/L1/',KEY='bac-g2p1-l1';
var S={view:'map',seg:0,sub:0,done:{},seenIntro:false};
try{var sv=JSON.parse(localStorage.getItem(KEY));if(sv&&sv.done){for(var k in sv)S[k]=sv[k];}}catch(e){}
if(typeof S.seg!=='number')S.seg=0;if(typeof S.sub!=='number')S.sub=0;
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function ar(n){return (''+n).replace(/\d/g,function(c){return '٠١٢٣٤٥٦٧٨٩'[c];});}
document.getElementById('L-title').textContent=LES.title;
document.getElementById('L-stage').textContent='المرحلة '+ar(STG.n)+': '+STG.title;
function totals(){var b=0,c=0;LES.segments.forEach(function(s){b+=s.questions.length;c+=(s.check||[]).length;});return {b:b,c:c};}
function paint(){
  var t=totals(),pc=Math.round(Object.keys(S.done).length/(t.b+t.c)*100);
  document.getElementById('fill').style.width=pc+'%';
  document.getElementById('pct').textContent=ar(pc)+'٪';
}
function zoom(src){var z=document.getElementById('zoom');document.getElementById('zoom-img').src=src;z.classList.add('on');}
function chime(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    var ctx=chime.ctx||(chime.ctx=new C());
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.12);
      g.gain.linearRampToValueAtTime(0.16,t+i*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.4);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+i*0.12);o.stop(t+i*0.12+0.45);
    });
  }catch(e){}
}
function showPop(html,ms,cb){
  var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="pop">'+html+'</div>';
  document.body.appendChild(o);
  chime();
  if(ms)setTimeout(function(){o.remove();if(cb)cb();},ms);
  return o;
}
function segDone(i){
  var sg=LES.segments[i],base=0;
  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;
  var ids=(sg.check||[]).map(function(_,k){return 'c'+i+'_'+k;});
  ids=ids.concat(sg.questions.map(function(_,k){return 'q'+(base+k);}));
  return ids.every(function(id){return S.done[id];});
}
function renderMap(){
  var m=document.getElementById('main');
  var firstOpen=LES.segments.findIndex(function(_,i){return !segDone(i);});
  var h='<div class="map">';
  var offs=[0,-34,0,34];
  LES.segments.forEach(function(sg,i){
    var done=segDone(i),unlocked=(i===0)||segDone(i-1);
    var cls=done?'done':(unlocked?'cur':'lock');
    var inner=done?'✓':(unlocked?ar(i+1):'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#fff" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>');
    h+='<div class="node" style="transform:translateX('+offs[i%4]+'px)">';
    h+='<button class="circle '+cls+'" data-node="'+i+'" '+(unlocked?'':'disabled')+'>'+inner+'</button>';
    h+='<div class="nlabel">'+sg.label.split(':')[0]+'</div>';
    h+='</div>';
    if(i<LES.segments.length-1)h+='<div class="linkline"></div>';
  });
  h+='</div>';
  m.innerHTML=h;paint();
  m.querySelectorAll('[data-node]').forEach(function(b){b.onclick=function(){
    S.view='lesson';S.seg=+b.dataset.node;S.sub=0;save();render();
  };});
  if(!S.seenIntro){
    var o=showPop('<div class="pop-h"><svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="#1c3d5a" stroke-width="2.5" stroke-linecap="round"><rect x="8" y="14" width="32" height="24" rx="6"/><line x1="24" y1="7" x2="24" y2="14"/><circle cx="24" cy="5" r="2.4" fill="#1c3d5a" stroke="none"/><circle cx="17" cy="26" r="2.6" fill="#1c3d5a" stroke="none"/><circle cx="31" cy="26" r="2.6" fill="#1c3d5a" stroke="none"/><line x1="18" y1="33" x2="30" y2="33"/></svg><span>تنبيه مهم</span></div><p>ده الكتاب كامل قدامك — مش محذوف منه ولا سؤال ولا معلومة.<br>فركز عشان تبقى ذاكرت كل حاجة يا بطل.</p><button class="pop-btn" id="introOk">ابدأ الدرس</button>');
    S.seenIntro=true;save();
    o.querySelector('#introOk').onclick=function(){o.remove();};
  }
}
function explainHTML(list){
  return list.map(function(e){
    if(e.b)return '<div class="card bk">'+D.B[e.b]+'</div>';
    return '<div class="card">'+(e.cap?'<div class="cap">'+e.cap+'</div>':'')+'<img loading="lazy" src="'+IMG+e.img+'.jpg" onclick="zoom(this.src)" alt="من الكتاب"></div>';
  }).join('');
}
function refHTML(ref){
  if(ref&&ref.img)return '<img loading="lazy" src="'+IMG+ref.img+'.jpg" onclick="zoom(this.src)">';
  var arr=Array.isArray(ref)?ref:[ref];
  return '<div class="bk">'+arr.map(function(k){return D.B[k];}).join('')+'</div>';
}
function mcqHTML(q,id,letters){
  var done=S.done[id];
  var h='<div class="q"><h3>'+q.q+'</h3>';
  h+=q.options.map(function(o,i){
    var cls='opt';
    if(done&&i===q.a)cls+=' ok';
    if(done&&done.picked===i&&i!==q.a)cls+=' no';
    return '<button class="'+cls+'" data-mq="'+id+'" data-i="'+i+'" '+(done?'disabled':'')+'><span class="k">'+letters[i]+'</span> '+o+(done&&i===q.a?' ✓':'')+'</button>';
  }).join('');
  if(done){
    if(done.picked===q.a)h+='<div class="feed ok">أحسنت! إجابة صحيحة ✓</div>';
    else h+='<div class="feed no">الإجابة الصحيحة بالأخضر — راجعها كويس</div>';
    if(q.why)h+='<details class="why"><summary>المرجع من الكتاب</summary>'+refHTML(q.why)+'</details>';
  }
  return h+'</div>';
}
function openHTML(q,id){
  var done=S.done[id];
  var h='<div class="q" id="'+id+'"><span class="src">'+q.src+'</span><h3>'+q.q+'</h3>';
  if(!done){
    h+='<textarea id="ta-'+id+'" placeholder="اكتب إجابتك هنا أولًا…"></textarea>';
    h+='<button class="btn btn-reveal" data-rev="'+id+'">اعرض الإجابة من الكتاب</button>';
    h+='<div class="ans" id="ans-'+id+'" hidden><div class="h">الإجابة من الكتاب — قارنها بما كتبت</div>'+refHTML(q.ans)+'</div>';
    h+='<button class="btn btn-done" data-ok="'+id+'" hidden id="ok-'+id+'">✓ راجعت إجابتي</button>';
  }else{
    h+='<div class="feed ok">تمت المراجعة ✓</div>';
    h+='<details class="why"><summary>الإجابة من الكتاب</summary>'+refHTML(q.ans)+'</details>';
  }
  return h+'</div>';
}
function segIds(i){
  var sg=LES.segments[i],base=0;
  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;
  var ids=(sg.check||[]).map(function(_,k){return 'c'+i+'_'+k;});
  return ids.concat(sg.questions.map(function(_,k){return 'q'+(base+k);}));
}
function cheerFor(seg){
  if(seg>=LES.segments.length-2)return 'هانت! فاضل خطوة وتخلص الدرس';
  if(seg>=5)return 'كمل يا بطل! عديت النص';
  if(seg>=2)return 'كمل، شغلك حلو';
  return 'عاش يا بطل! بداية جامدة';
}
function renderLesson(){
  var m=document.getElementById('main');
  if(S.seg>=LES.segments.length){
    m.innerHTML='<div class="done-screen"><div class="big"><svg viewBox="0 0 64 64" width="72" height="72"><circle cx="32" cy="32" r="29" fill="none" stroke="#fa9005" stroke-width="4"/><path d="M20 33l8 8 16-18" fill="none" stroke="#1c3d5a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>أحسنت! أنهيت الدرس الأول</h2><p>قرأت الشرح كاملًا وأجبت على '+ar(totals().b)+' سؤالًا من الكتاب و'+ar(totals().c)+' سؤال فهم سريع.<br>الدرس التالي يُفتح بعد اعتماد المعلم.</p></div><button class="next" id="toMap">العودة للخريطة ◂</button>';
    paint();chime();window.scrollTo(0,0);
    document.getElementById('toMap').onclick=function(){S.view='map';S.seg=LES.segments.length-1;S.sub=1;save();render();};
    return;
  }
  var sg=LES.segments[S.seg];
  var base=0;for(var i=0;i<S.seg;i++)base+=LES.segments[i].questions.length;
  var h='<div class="seg-label"><span class="n">'+ar(S.seg+1)+'/'+ar(LES.segments.length)+'</span> '+sg.label+' — '+(S.sub===0?'الشرح':'الأسئلة')+'</div>';
  if(S.sub===0){
    h+=explainHTML(sg.explain);
  }else{
    var letters=['أ','ب','ج','د'];
    if(sg.check&&sg.check.length){
      h+='<div class="sec-h">أسئلة سريعة على ما قرأته</div>';
      h+=sg.check.map(function(q,i){return mcqHTML(q,'c'+S.seg+'_'+i,q.options.length===2?['صح','خطأ']:letters);}).join('');
    }
    if(sg.questions.length){
      h+='<div class="sec-h">أسئلة الكتاب</div>';
      h+=sg.questions.map(function(q,i){
        var id='q'+(base+i);
        return q.t==='mcq'?mcqHTML(q,id,letters):openHTML(q,id);
      }).join('');
    }
  }
  var allDone=segIds(S.seg).every(function(id){return S.done[id];});
  var isLast=(S.seg===LES.segments.length-1&&S.sub===1);
  h+='<div class="navrow">';
  h+='<button class="prev" id="prevBtn">رجوع ▸</button>';
  if(S.sub===0)h+='<button class="next" id="nextBtn">انتقل للأسئلة ◂</button>';
  else h+='<button class="next" id="nextBtn" '+(allDone?'':'disabled')+'>'+(isLast?'إنهاء الدرس':'الجزء التالي ◂')+'</button>';
  h+='</div>';
  h+='<div class="lock">'+(S.sub===1&&!allDone?'أجب على كل الأسئلة لفتح الجزء التالي':'')+'</div>';
  m.innerHTML=h;paint();window.scrollTo(0,0);
  m.querySelectorAll('[data-mq]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.mq]={picked:+b.dataset.i};save();render();
    var el=b.closest('.q');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  };});
  m.querySelectorAll('[data-rev]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.rev;
    document.getElementById('ans-'+id).hidden=false;
    document.getElementById('ok-'+id).hidden=false;
    b.hidden=true;
  };});
  m.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.ok]={open:true};save();render();
  };});
  document.getElementById('prevBtn').onclick=function(){
    if(S.sub===1){S.sub=0;}
    else{S.view='map';}
    save();render();
  };
  document.getElementById('nextBtn').onclick=function(){
    var nb=this;if(nb.disabled)return;
    if(S.sub===0){S.sub=1;save();render();return;}
    var finishedSeg=S.seg;
    S.seg++;S.sub=0;save();
    showPop('<div class="pop-h"><svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="#1c3d5a" stroke-width="2.5" stroke-linecap="round"><rect x="8" y="14" width="32" height="24" rx="6"/><line x1="24" y1="7" x2="24" y2="14"/><circle cx="24" cy="5" r="2.4" fill="#1c3d5a" stroke="none"/><circle cx="17" cy="26" r="2.6" fill="#1c3d5a" stroke="none"/><circle cx="31" cy="26" r="2.6" fill="#1c3d5a" stroke="none"/><line x1="18" y1="33" x2="30" y2="33"/></svg><span>'+cheerFor(finishedSeg)+'</span></div>',1500,function(){render();});
  };
}
function render(){if(S.view==='map')renderMap();else renderLesson();}
render();

</script></body></html>
