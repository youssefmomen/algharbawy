document.getElementById('L-stage').textContent='المرحلة '+ar(STG.n)+': '+STG.title;
}else{
document.getElementById('L-title').textContent='التاريخ الوطني';
document.getElementById('L-stage').textContent='اختر الدرس';
document.querySelector('.prog').style.display='none';
}
document.getElementById('hd-dood').innerHTML=dood('pyramid','top:14px;left:14px;opacity:.85','#f6efdd',58)+dood('sun','top:86px;left:64px;opacity:.9','#f5b301',34);
function totals(){var b=0,c=0;LES.segments.forEach(function(s){b+=s.questions.length;c+=(s.check||[]).length;});return {b:b,c:c};}
function paint(){
  var t=totals(),pc=Math.round(Object.keys(S.done).length/(t.b+t.c)*100);
  document.getElementById('fill').style.width=pc+'%';
  document.getElementById('pct').textContent=ar(pc)+'٪';
}
function zoom(src){var z=document.getElementById('zoom');document.getElementById('zoom-img').src=src;z.classList.add('on');}
function chime(){
  try{
    var C=window.AudioContext||window.webkitAudioContext;
    var ctx=chime.ctx||(chime.ctx=new C());
    if(ctx.state==='suspended')ctx.resume();
    var t=ctx.currentTime;
    [523.25,659.25,783.99,1046.5].forEach(function(f,i){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.12);
      g.gain.linearRampToValueAtTime(0.16,t+i*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.4);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+i*0.12);o.stop(t+i*0.12+0.45);
    });
  }catch(e){}
}
function showPop(html,ms,cb){
  var o=document.createElement('div');o.className='overlay';o.innerHTML='<div class="pop">'+html+'</div>';
  document.body.appendChild(o);
  chime();
  if(ms)setTimeout(function(){o.remove();if(cb)cb();},ms);
  return o;
}
var ROBOT='<svg viewBox="0 0 48 48" width="42" height="42" fill="none" stroke="var(--ink)" stroke-width="2.5" stroke-linecap="round"><rect x="8" y="14" width="32" height="24" rx="6"/><line x1="24" y1="7" x2="24" y2="14"/><circle cx="24" cy="5" r="2.4" fill="var(--ink)" stroke="none"/><circle cx="17" cy="26" r="2.6" fill="var(--ink)" stroke="none"/><circle cx="31" cy="26" r="2.6" fill="var(--ink)" stroke="none"/><line x1="18" y1="33" x2="30" y2="33"/></svg>';
function segDone(i){
  var sg=LES.segments[i],base=0;
  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;
  var ids=(sg.check||[]).map(function(_,k){return 'c'+i+'_'+k;});
  ids=ids.concat(sg.questions.map(function(_,k){return 'q'+(base+k);}));
  return ids.every(function(id){return S.done[id];});
}
function renderMap(){
  var m=document.getElementById('main');
  var h='<div class="map">';
  var offs=[0,-34,0,34];
  LES.segments.forEach(function(sg,i){
    var done=segDone(i),unlocked=(i===0)||segDone(i-1);
    var cls=done?'done':(unlocked?'cur':'lock');
    var inner=done?'✓':(unlocked?ar(i+1):'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>');
    h+='<div class="node" style="transform:translateX('+offs[i%4]+'px)">';
    h+='<button class="circle '+cls+'" data-node="'+i+'" '+(unlocked?'':'disabled')+'>'+inner+'</button>';
    h+='<div class="nlabel">'+sg.label.split(':')[0]+'</div>';
    h+='</div>';
    if(i<LES.segments.length-1)h+='<div class="linkline"></div>';
  });
  h+='</div>';
  m.innerHTML=h;
  var map=m.querySelector('.map');
  map.insertAdjacentHTML('beforeend',
    dood('pyramid','top:120px;left:8px;opacity:.5','var(--ink)',64)+
    dood('sun','top:210px;right:16px;opacity:.6','#e07b00',44)+
    dood('felucca','top:330px;left:6px;opacity:.5','var(--ink)',72)+
    dood('water','top:460px;right:8px;opacity:.5','var(--blue)',66)+
    dood('column','top:560px;left:14px;opacity:.5','var(--ink)',58)+
    dood('ankh','top:680px;right:20px;opacity:.5','var(--red)',46)+
    dood('scroll','top:790px;left:16px;opacity:.5','var(--ink)',56));
  paint();
  m.querySelectorAll('[data-node]').forEach(function(b){b.onclick=function(){
    S.view='lesson';S.seg=+b.dataset.node;S.sub=0;save();render();
  };});
  if(!S.seenIntro){
    var o=showPop('<div class="pop-h">'+ROBOT+'<span>تنبيه مهم</span></div><p>ده الكتاب كامل قدامك — مش محذوف منه ولا سؤال ولا معلومة.<br>فركز عشان تبقى ذاكرت كل حاجة يا بطل.</p><button class="pop-btn" id="introOk">ابدأ الدرس</button>');
    S.seenIntro=true;save();
    o.querySelector('#introOk').onclick=function(){o.remove();};
  }
}
function explainHTML(list){
  return list.map(function(e,ix){
    if(e.b)return '<div class="card bk">'+D.B[e.b]+'</div>';
    if(e.illus){var il=ILLUST[e.illus];return '<div class="illus">'+(il?il.svg:'')+(il&&il.cap?'<div class="il-cap">'+il.cap+'</div>':'')+'</div>';}
    return '<div class="frame'+(ix%2?' alt':'')+'"><img loading="lazy" src="'+IMG+e.img+'.jpg" onclick="zoom(this.src)" alt="من الكتاب">'+(e.cap?'<div class="cap">'+e.cap+'</div>':'')+'</div>';
  }).join('');
}
function refHTML(ref){
  if(ref&&ref.img)return '<img loading="lazy" src="'+IMG+ref.img+'.jpg" onclick="zoom(this.src)">';
  var arr=Array.isArray(ref)?ref:[ref];
  return '<div class="bk">'+arr.map(function(k){return D.B[k];}).join('')+'</div>';
}
function mcqHTML(q,id,letters){
  var done=S.done[id];
  var h='<div class="q"><h3>'+q.q+'</h3>';
  h+=q.options.map(function(o,i){
    var cls='opt';
    if(done&&i===q.a)cls+=' ok';
    if(done&&done.picked===i&&i!==q.a)cls+=' no';
    return '<button class="'+cls+'" data-mq="'+id+'" data-i="'+i+'" '+(done?'disabled':'')+'><span class="k">'+letters[i]+'</span> '+o+(done&&i===q.a?' ✓':'')+'</button>';
  }).join('');
  if(done){
    if(done.picked===q.a)h+='<div class="feed ok">أحسنت! إجابة صحيحة ✓</div>';
    else h+='<div class="feed no">الإجابة الصحيحة بالأخضر — راجعها كويس</div>';
    if(q.why)h+='<details class="why"><summary>المرجع من الكتاب</summary>'+refHTML(q.why)+'</details>';
  }
  return h+'</div>';
}
function openHTML(q,id){
  var done=S.done[id];
  var mod=q.mod?'<div class="mod">'+q.mod+'</div>':refHTML(q.ans);
  var h='<div class="q" id="'+id+'"><span class="src">'+q.src+'</span><h3>'+q.q+'</h3>';
  if(!done){
    h+='<textarea id="ta-'+id+'" placeholder="اكتب إجابتك هنا أولًا…"></textarea>';
    h+='<button class="btn btn-reveal" data-rev="'+id+'">اعرض نموذج الإجابة</button>';
    h+='<div class="ans" id="ans-'+id+'" hidden><div class="h">نموذج الإجابة — قارنها بما كتبت</div>'+mod+'</div>';
    h+='<button class="btn btn-done" data-ok="'+id+'" hidden id="ok-'+id+'">✓ راجعت إجابتي</button>';
  }else{
    h+='<div class="feed ok">تمت المراجعة ✓</div>';
    h+='<details class="why"><summary>نموذج الإجابة</summary>'+mod+'</details>';
  }
  return h+'</div>';
}
function segIds(i){
  var sg=LES.segments[i],base=0;
  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;
  var ids=(sg.check||[]).map(function(_,k){return 'c'+i+'_'+k;});
  return ids.concat(sg.questions.map(function(_,k){return 'q'+(base+k);}));
}
function cheerFor(seg){
  if(seg>=LES.segments.length-2)return 'هانت! فاضل خطوة وتخلص الدرس';
  if(seg>=5)return 'كمل يا بطل! عديت النص';
  if(seg>=2)return 'كمل، شغلك حلو';
  return 'عاش يا بطل! بداية جامدة';
}
function starify(m){
  m.querySelectorAll('.bk .rh').forEach(function(r){
    if(!r.querySelector('.rh-star'))r.insertAdjacentHTML('afterbegin','<span class="rh-star">'+ST+'</span>');
  });
}
function renderLesson(){
  var m=document.getElementById('main');
  if(S.seg>=LES.segments.length){
    m.innerHTML='<div class="done-screen"><div class="big"><svg viewBox="0 0 64 64" width="72" height="72"><circle cx="32" cy="32" r="29" fill="none" stroke="var(--green)" stroke-width="4"/><path d="M20 33l8 8 16-18" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>أحسنت! أنهيت '+LES.title.split(':')[0]+'</h2><p>قرأت الشرح كاملًا وأجبت على '+ar(totals().b)+' سؤالًا من الكتاب و'+ar(totals().c)+' سؤال فهم سريع.<br>انتقل إلى الدرس التالي من زر «الدروس» أسفل الشاشة.</p></div><div class="navrow"><button class="next" id="toMap">العودة للخريطة ◂</button></div>';
    paint();chime();window.scrollTo(0,0);
    document.getElementById('toMap').onclick=function(){S.view='map';S.seg=LES.segments.length-1;S.sub=1;save();render();};
    return;
  }
  var sg=LES.segments[S.seg];
  var base=0;for(var i=0;i<S.seg;i++)base+=LES.segments[i].questions.length;
  var h='<div class="seg-label"><span class="n">'+ar(S.seg+1)+'/'+ar(LES.segments.length)+'</span> '+sg.label+' — '+(S.sub===0?'الشرح':'الأسئلة')+'</div>';
  if(S.sub===0){
    h+=explainHTML(sg.explain);
  }else{
    var letters=['أ','ب','ج','د'];
    if(sg.check&&sg.check.length){
      h+='<div class="sec-h">أسئلة سريعة على ما قرأته</div>';
      h+=sg.check.map(function(q,i){return mcqHTML(q,'c'+S.seg+'_'+i,q.options.length===2?['صح','خطأ']:letters);}).join('');
    }
    if(sg.questions.length){
      h+='<div class="sec-h">أسئلة الكتاب</div>';
      h+=sg.questions.map(function(q,i){
        var id='q'+(base+i);
        return q.t==='mcq'?mcqHTML(q,id,letters):openHTML(q,id);
      }).join('');
    }
  }
  var allDone=segIds(S.seg).every(function(id){return S.done[id];});
  var isLast=(S.seg===LES.segments.length-1&&S.sub===1);
  h+='<div class="navrow">';
  h+='<button class="prev" id="prevBtn">رجوع ▸</button>';
  if(S.sub===0)h+='<button class="next" id="nextBtn">انتقل للأسئلة ◂</button>';
  else h+='<button class="next" id="nextBtn" '+(allDone?'':'disabled')+'>'+(isLast?'إنهاء الدرس':'الجزء التالي ◂')+'</button>';
  h+='</div>';
  h+='<div class="lock">'+(S.sub===1&&!allDone?'أجب على كل الأسئلة لفتح الجزء التالي':'')+'</div>';
  m.innerHTML=h;starify(m);paint();window.scrollTo(0,0);
  m.querySelectorAll('[data-mq]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.mq]={picked:+b.dataset.i};save();render();
    var el=b.closest('.q');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  };});
  m.querySelectorAll('[data-rev]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.rev;
    document.getElementById('ans-'+id).hidden=false;
    document.getElementById('ok-'+id).hidden=false;
    b.hidden=true;
  };});
  m.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.ok]={open:true};save();render();
  };});
  document.getElementById('prevBtn').onclick=function(){
    if(S.sub===1){S.sub=0;}
    else{S.view='map';}
    save();render();
  };
  document.getElementById('nextBtn').onclick=function(){
    var nb=this;if(nb.disabled)return;
    if(S.sub===0){S.sub=1;save();render();return;}
    var finishedSeg=S.seg;
    S.seg++;S.sub=0;save();
    showPop('<div class="pop-h">'+ROBOT+'<span>'+cheerFor(finishedSeg)+'</span></div>',1500,function(){render();});
  };
}
function renderList(){
  var m=document.getElementById('main');
  var h='';
  D.stages.forEach(function(st){
    var ls=D.lessons.map(function(l,i){return {l:l,i:i};}).filter(function(x){return x.l.stage===st.id;});
    if(!ls.length)return;
    h+='<div class="sec-h">الوحدة '+ar(st.n)+': '+st.title+'</div>';
    ls.forEach(function(x){
      var pc=0;
      try{var sv=JSON.parse(localStorage.getItem('bac-g2p1-'+x.l.id));
        if(sv&&sv.done){var tot=0;x.l.segments.forEach(function(sg){tot+=sg.questions.length+(sg.check||[]).length;});
        if(tot)pc=Math.round(Object.keys(sv.done).length/tot*100);}}catch(e){}
      h+='<div class="lcard" data-l="'+(x.i+1)+'"><span class="lc-n'+(pc===100?' full':'')+'">'+(pc===100?'✓':ar(x.i+1))+'</span><div class="lc-t"><b>'+x.l.title+'</b><span>'+(pc>0?('أنجزت '+ar(pc)+'٪ من الدرس'):'لم تبدأ بعد')+'</span></div></div>';
    });
  });
  m.innerHTML=h;
  m.querySelectorAll('.lcard').forEach(function(c){c.onclick=function(){location.href='bac.html?lesson='+c.dataset.l;};});
}
function exitBtn(){
  var b=document.getElementById('exitBtn');
  if(!LES){b.style.display='none';return;}
  b.style.display='flex';
  if(S.view==='map'){
    b.innerHTML='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="7" height="7" rx="2"/><rect x="13" y="13" width="7" height="7" rx="2"/></svg><span>الدروس</span>';
    b.onclick=function(){location.href='bac.html';};
  }else{
    b.innerHTML='<svg viewBox="0 0 24 24"><circle cx="6" cy="18" r="2.4"/><circle cx="18" cy="6" r="2.4"/><path d="M8 16 Q14 12 16 8" stroke-dasharray="2 3"/></svg><span>الخريطة</span>';
    b.onclick=function(){S.view='map';save();render();};
  }
}
function render(){
  if(!LES){renderList();exitBtn();return;}
  if(S.view==='map')renderMap();else renderLesson();
  exitBtn();
}
render();

</script></body></html>
