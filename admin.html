<body data-page="admin">
<main class="wrap">
  <button class="theme-toggle adm-theme" id="ghThemeBtn" type="button" aria-label="تبديل الوضع الليلي والنهاري" title="الوضع الليلي / النهاري"></button>
  <div class="adm-head rv">
    <div class="page-mark"><span class="mark"><i>غ</i></span></div>
    <h1>لوحة التحكم</h1>
    <p class="sub">متابعة الطلاب وتقدمهم</p>
  </div>

  <div class="adm-note" id="adm-gate" hidden></div>

  <div id="adm-body" hidden>
    <div class="t-sect-wrap"><h2 class="t-sect">طلبات المعلمين</h2>
    <div class="t-list" id="adm-teachers"></div>
    <div class="adm-note" id="adm-teachers-empty" hidden>لا طلبات معلمين معلّقة.</div></div>
    <div class="t-sect-wrap"><h2 class="t-sect">شريط الإعلانات</h2>
    <div class="t-form">
      <input type="text" id="ticker-text" maxlength="200" placeholder="نص الإعلان الذي يظهر أعلى الصفحة الرئيسية (اتركه فارغًا مع إيقاف التفعيل لإخفائه)" style="width:100%;padding:10px 12px;border:1px solid rgba(212,175,95,.25);border-radius:10px;background:rgba(0,0,0,.25);color:inherit;font-family:inherit">
      <div class="t-pub" style="margin-top:10px"><label><input type="checkbox" id="ticker-active"> مفعّل: يظهر الشريط لكل الزوار</label></div>
      <div class="t-acts-col"><button class="btn fill" id="ticker-save" type="button">حفظ الإعلان</button><span class="t-hint" id="ticker-msg"></span></div>
    </div></div>
    <div class="adm-cards" id="adm-cards"></div>
    <div class="adm-tablewrap">
      <table class="adm-table">
        <thead><tr>
          <th>البريد الإلكتروني</th><th>دروس مكتملة</th><th>النجوم</th><th>نقاط الخبرة</th><th>آخر نشاط</th>
        </tr></thead>
        <tbody id="adm-rows"></tbody>
      </table>
      <div class="adm-note" id="adm-empty" hidden>لا يوجد طلاب مسجلون بعد</div>
    </div>
  </div>
</main>
<footer id="footer"></footer>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<script src="assets/store.js?v=4"></script>
<script src="assets/teach.js?v=1"></script>
<script src="assets/admin.js?v=5"></script>
</body>
</html>
