<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>صانع الملازم</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&family=Almarai:wght@400;700;800&family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;700&family=Reem+Kufi:wght@400;700&family=Changa:wght@400;700;800&family=El+Messiri:wght@400;600;700&family=Harmattan:wght@400;700&family=Readex+Pro:wght@400;600;700&family=Baloo+Bhaijaan+2:wght@400;700;800&family=Markazi+Text:wght@400;700&family=Aref+Ruqaa:wght@400;700&family=Lemonada:wght@400;700&family=Scheherazade+New:wght@400;700&family=Mada:wght@400;700;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:Cairo,Tajawal,sans-serif;background:#e9edf3;color:#1b2430;font-size:15px}
button,input,select,textarea{font-family:inherit;font-size:15px}
#app{display:flex;flex-direction:column;height:100%}
.top{background:#1e4f9e;color:#fff;padding:8px 10px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.top b{font-size:17px;margin-inline-end:auto}
.top button{background:#fff;color:#1e4f9e;border:0;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
.top button.pdf{background:#ffd23f;color:#222}
.tabs{display:none;background:#fff;border-bottom:1px solid #d5dbe5}
.tabs button{flex:1;padding:10px;border:0;background:none;font-weight:700;color:#556;border-bottom:3px solid transparent}
.tabs button.on{color:#1e4f9e;border-color:#1e4f9e}
.main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(380px,460px) 1fr}
#ed{overflow:auto;background:#f6f8fb;padding:10px;border-inline-end:1px solid #d5dbe5}
#pv{overflow-y:auto;overflow-x:hidden;padding:12px;display:flex;flex-direction:column;align-items:center;gap:14px}
.pvw{position:relative;box-shadow:0 2px 12px #0003;background:#fff;flex:none;cursor:pointer}
.pvw .sheet{position:absolute;top:0;left:0;transform-origin:top left}
.pvw .warn{position:absolute;top:6px;right:6px;background:#d33;color:#fff;border-radius:8px;padding:4px 8px;font-size:12px;z-index:3;font-weight:700}
.pvw.sel{outline:3px solid #ffb400}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.chip{border:1px solid #b9c5d8;background:#fff;border-radius:10px;padding:6px 11px;font-weight:700;cursor:pointer;color:#234}
.chip.on{background:#1e4f9e;color:#fff;border-color:#1e4f9e}
.chip.bad{border-color:#d33;color:#d33}.chip.on.bad{background:#d33;color:#fff}
.chip.add{background:#e7f5ea;border-color:#7cc08b;color:#17692d}
.card{background:#fff;border:1px solid #d5dbe5;border-radius:12px;padding:10px;margin-bottom:10px}
.card.flash{outline:3px solid #ffb400}
.card h4{margin:0 0 8px;font-size:15px;color:#1e4f9e;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card h4 .sp{flex:1}
.mini{border:1px solid #c5cfdf;background:#f2f5fa;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600}
.mini.del{color:#c22;border-color:#e3b0b0}
label.f{display:block;margin:6px 0 2px;font-size:13px;color:#456;font-weight:600}
.card input[type=text],.card input[type=number],.card textarea,.card select,.pan input[type=text],.pan input[type=number],.pan select{width:100%;padding:8px;border:1px solid #c5cfdf;border-radius:8px;background:#fff}
textarea{min-height:64px;resize:vertical}
.row{display:flex;gap:8px}.row>*{flex:1;min-width:0}
.row.wrap>*{flex:0 1 auto}
.adds{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.adds button{background:#1e4f9e;color:#fff;border:0;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
.adds button.g{background:#17803a}.adds button.o{background:#c76a00}
.pan{background:#fff;border:1px solid #d5dbe5;border-radius:12px;padding:10px;margin-bottom:10px}
.pan h3{margin:0 0 6px;font-size:16px;color:#1e4f9e}
.sw{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.sw button{border:2px solid #fff;outline:1px solid #bbb;width:34px;height:34px;border-radius:50%;cursor:pointer}
.tb{border-collapse:collapse;width:100%}.tb td{padding:2px}.tb input{padding:5px!important}
.hint{font-size:12.5px;color:#678;margin:4px 0}
.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center;z-index:50;padding:12px}
.modal.on{display:flex}.modal>div{background:#fff;border-radius:14px;padding:14px;width:100%;max-width:520px;max-height:92vh;overflow:auto}
.sheet{width:794px;height:1123px;position:relative;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f);font-size:var(--fs);direction:rtl;display:flex;flex-direction:column;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.sheet .hdbar{background:linear-gradient(90deg,var(--pri2),var(--pri));color:#fff;height:50px;display:flex;align-items:center;justify-content:center;font-family:var(--fh);font-weight:700;font-size:17px;flex:none;position:relative;z-index:1}
.sheet .hl{color:#ffd23f}
.sheet .bd{flex:1;min-height:0;position:relative;padding:14px 18px;display:grid;grid-template-columns:1fr 1fr;gap:9px;align-content:start;overflow:hidden;z-index:1}
.sheet .deco{position:absolute;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.sheet .deco span{position:absolute;font-family:var(--fh);font-weight:800;color:var(--pri);opacity:.08;line-height:1}
.sheet .ftbar{height:46px;flex:none;background:var(--soft);border-top:2px solid var(--pri);display:flex;align-items:center;gap:12px;padding:0 18px;font-size:12.5px;font-weight:700;z-index:1}
.sheet .ftbar .pg{background:var(--pri);color:#fff;border-radius:14px;padding:3px 14px}
.sheet .ftbar .tx{flex:1;text-align:center}
.sheet .ftbar img{height:36px;width:36px;object-fit:contain}
.it{grid-column:1/-1;position:relative}
.it.half{grid-column:span 1}
.it.h{background:linear-gradient(90deg,var(--hc),var(--hc));color:#fff;font-family:var(--fh);font-weight:800;font-size:1.12em;padding:8px 14px;border-radius:9px;border-right:14px solid #ffd23f;display:flex;align-items:center;gap:8px}
.it.h.pri{--hc:var(--pri)}.it.h.acc{--hc:var(--acc)}
.it.h .hn{background:#fff;color:var(--hc);width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:.85em}
.it.q{border:1.5px solid var(--soft2);background:#fff;border-radius:9px;padding:8px 10px 8px 10px;display:block}
.it.q .qn{display:inline-block;background:var(--pri);color:#fff;font-size:.78em;font-weight:700;border-radius:6px;padding:0 7px;margin-inline-start:6px;vertical-align:baseline}
.it .t{white-space:pre-wrap;line-height:1.7}
.it.q .qt{font-weight:700;white-space:pre-wrap;line-height:1.7}
.it.q .chs{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 2px}
.it.q .chs span{border:1.2px solid var(--pri);color:var(--pri);border-radius:6px;padding:1px 10px;font-weight:600;font-size:.92em;background:#fff}
.it.q .an{margin-top:6px;background:#e6f4ea;border-right:3px solid var(--acc);border-radius:6px;padding:4px 8px;line-height:1.65;white-space:pre-wrap;font-size:.95em}
.it.q .an b{color:var(--acc)}
.it.q .fl{display:flex;gap:8px;align-items:flex-start}
.it .im{display:block;max-width:100%;border-radius:6px;margin:6px auto}
.it.q .lines{margin-top:8px}.it.q .lines i{display:block;border-bottom:1px dotted #8a96a8;height:20px}
.it.box{border-radius:9px;padding:8px 12px;line-height:1.7;white-space:pre-wrap;border:1.5px solid}
.it.box.note{background:#fff8d6;border-color:#f2d049}.it.box.tip{background:#e6f4ea;border-color:var(--acc)}.it.box.warn{background:#fde8e8;border-color:#d96b6b}
.it.box b{margin-inline-end:6px}
.it table{width:100%;border-collapse:collapse;font-size:.92em}
.it th{background:var(--pri);color:#fff;padding:5px 8px;border:1px solid var(--pri)}
.it td{padding:5px 8px;border:1px solid var(--soft2);background:#fff;line-height:1.6;white-space:pre-wrap}
.it tr:nth-child(even) td{background:var(--soft)}
.it figure{margin:0;text-align:center}.it figcaption{font-size:.85em;color:#556}
.it.dia{display:flex;flex-direction:column;align-items:center;gap:0}
.dia .c{background:var(--pri);color:#fff;font-weight:800;border-radius:9px;padding:6px 26px;font-family:var(--fh)}
.dia .ln{width:2px;height:12px;background:var(--pri)}
.dia .ch{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;border-top:2px solid var(--pri);padding-top:12px;width:100%}
.dia .ch div{border:2px solid var(--pri);background:#fff;border-radius:9px;padding:6px 10px;text-align:center;line-height:1.6;flex:1;min-width:120px;max-width:250px;white-space:pre-wrap}
.cover{background:linear-gradient(160deg,var(--pri),var(--pri2));color:#fff;align-items:center;justify-content:flex-start;text-align:center}
.cover .deco span{color:#fff;opacity:.13}
.cover .ct{position:relative;z-index:1;margin-top:70px;width:100%;padding:0 50px}
.cover .ct small{font-size:20px;font-weight:700;display:block;margin-bottom:12px}
.cover .ct h1{display:inline-block;margin:6px 0;background:#fff;color:#111;font-family:var(--fh);font-weight:800;font-size:46px;padding:4px 26px;line-height:1.5}
.cover .pic{position:relative;z-index:1;flex:1;min-height:0;width:100%;display:flex;align-items:flex-end;justify-content:center;margin-top:10px}
.cover .pic img{max-height:100%;max-width:70%;object-fit:contain}
.cover .tag{position:absolute;z-index:2;bottom:120px;left:50%;transform:translateX(-50%);background:#fff;color:#111;border-radius:6px;padding:10px 34px;font-family:var(--fh);text-align:center;min-width:330px;box-shadow:0 4px 14px #0004}
.cover .tag b{display:block;font-size:42px;font-weight:800;color:var(--pri2);line-height:1.4}.cover .tag span{font-size:20px;font-weight:700;color:var(--pri)}.cover .tag small{display:block;font-size:20px;font-weight:700;letter-spacing:.5px}
.cover .cf{position:relative;z-index:2;width:100%;padding:16px 40px;display:flex;gap:14px;align-items:center;justify-content:center;font-weight:800}
.cover .cf img{height:64px;width:64px;background:#fff;padding:3px;border-radius:6px}
.cover .cf .ph{font-size:30px;direction:ltr}
.cover .cf .lb{font-size:15px;text-align:right;max-width:170px;line-height:1.5}
#printRoot{display:none}
@media (max-width:860px){
 .top b{display:none}
 .top{justify-content:center}
 .top button{flex:1}
 .tabs{display:flex}
 .main{grid-template-columns:1fr}
 #ed,#pv{display:none}
 body[data-tab=ed] #ed{display:block}
 body[data-tab=pv] #pv{display:flex}
 .top button{padding:7px 9px;font-size:13.5px}
}
@page{size:A4;margin:0}
@media print{
 html,body{height:auto;background:#fff}
 #app,.modal{display:none!important}
 #printRoot{display:block}
 #printRoot .sheet{page-break-after:always;break-after:page;margin:0}
 #printRoot .sheet:last-child{page-break-after:auto;break-after:auto}
}
</style>
</head>

 <div class="row"><div><label class="f">لون خلفية الغلاف (من)</label><input type="color" style="width:100%;height:38px" data-o="meta" data-k="cb1" value="${m.cb1||t.pri}"></div><div><label class="f">إلى</label><input type="color" style="width:100%;height:38px" data-o="meta" data-k="cb2" value="${m.cb2||t.pri2}"></div></div><div class="row" style="margin-top:6px"><button class="mini" data-act="rstcb">رجوع للون الملزمة</button></div>
 <label class="f">حجم صورة الغلاف</label><input type="range" min="30" max="100" data-o="meta" data-k="imgW" data-n="1" value="${m.imgW||70}" style="width:100%"><label class="f">مكان الصورة (أعلى / أسفل)</label><input type="range" min="-250" max="120" data-o="meta" data-k="imgY" data-n="1" value="${m.imgY||0}" style="width:100%">
 <div class="row" style="margin-top:8px"><button class="mini" data-act="pickcover">${m.coverImg?'تغيير صورة الغلاف':'إضافة صورة الغلاف'}</button>${m.coverImg?'<button class="mini del" data-act="rmcover">حذف الصورة</button>':''}</div></div>
 <div class="pan"><h3>الرقم و QR في كل صفحة</h3><label class="f"><input type="checkbox" data-o="ft" data-k="showPhone" ${f.showPhone?'checked':''}> أظهر رقم التليفون</label>${T('الرقم','ft','phone')}${T('النص بجانب الرقم','ft','label')}
 <label class="f"><input type="checkbox" data-o="ft" data-k="showQr" ${f.showQr?'checked':''}> أظهر رمز QR</label><div class="row" style="margin-top:6px"><button class="mini" data-act="pickqr">تغيير صورة QR</button><button class="mini" data-act="resetqr">رجوع لرمز مستر يوسف</button></div>
 <label class="f"><input type="checkbox" data-o="ft" data-k="pageNo" ${f.pageNo?'checked':''}> رقم الصفحة</label>
 <label class="f">ترقيم الأسئلة</label><select data-top="numMode"><option value="page" ${S.numMode==='page'?'selected':''}>يبدأ من ١ في كل صفحة</option><option value="cont" ${S.numMode==='cont'?'selected':''}>متصل عبر الملزمة</option></select></div>`}
function setTab(t){document.body.dataset.tab=t==='de'?'ed':t;view=t==='de'?'de':t==='pv'?view:t;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.t===t));if(t==='de')renderDe();else if(t==='ed'){view='ed';renderEd()}if(t==='pv')renderPv()}
/* ===== أحداث ===== */
const ed=$('#ed');
function mkItem(t){const b={w:'auto'};return Object.assign(b,{q:{t:'q',text:'',ch:'',ans:'',showAns:true,img:'',imgW:60,imgPos:'below',lines:0},h:{t:'h',text:'عنوان جديد',num:'',col:'pri'},p:{t:'p',text:''},box:{t:'box',kind:'note',label:'تنبيه:',text:''},tbl:{t:'tbl',head:true,rows:[['عنوان 1','عنوان 2'],['','']],w:'full'},img:{t:'img',img:'',imgW:60,text:''},dia:{t:'dia',text:'الفكرة الرئيسية\nفرع أول\nفرع ثان'}}[t])}
ed.addEventListener('input',e=>{const el=e.target;let v=el.type==='checkbox'?el.checked:el.value;if(el.dataset.n)v=+v;
 if(el.dataset.o){S[el.dataset.o][el.dataset.k]=v;if(el.dataset.k==='fs'){const l=el.previousElementSibling;l.textContent='حجم النص ('+v+'px)'}schedPv();return}
 if(el.dataset.top){S[el.dataset.top]=v;schedPv();return}
 if(el.dataset.pgk){S.pages[cur][el.dataset.pgk]=el.dataset.pgk==='cols'?+v:v;schedPv();return}
 if(el.dataset.act==='mv')return;
 if(el.dataset.k==='header'&&el.dataset.p===''){S.pages[cur].header=v;schedPv();return}
 if(el.dataset.p===undefined)return;const it=S.pages[+el.dataset.p].items[+el.dataset.i];
 if(el.dataset.r!==undefined)it.rows[+el.dataset.r][+el.dataset.c]=v;else it[el.dataset.k]=v;schedPv()});
ed.addEventListener('change',e=>{const el=e.target;if(el.dataset.act==='mv'){move(+el.dataset.i,+el.value)}else if(el.dataset.k==='showAns'||el.dataset.k==='cover'||el.dataset.k==='w'||el.dataset.k==='imgPos'||el.dataset.k==='kind'){if(el.dataset.o==='meta'&&el.dataset.k==='cover'){S.meta.cover=el.checked}}});
function move(i,to){const a=S.pages[cur].items;const [x]=a.splice(i,1);S.pages[to].items.push(x);cur=to;sel=-1;renderEd();schedPv()}
let imgTarget=null;
ed.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const P=S.pages[cur];const i=+b.dataset.i;
 if(b.dataset.pg!==undefined){cur=+b.dataset.pg;renderEd();renderPv();return}
 if(b.dataset.add){P.items.push(mkItem(b.dataset.add));renderEd();schedPv();const c=ed.querySelectorAll('.card');if(c.length)c[c.length-1].scrollIntoView({block:'center'});return}
 if(b.dataset.preset!==undefined){const p=PRESETS[+b.dataset.preset];Object.assign(S.th,{pri:p[1],pri2:p[2],acc:p[3],soft:p[4]});renderDe();schedPv();return}
 const a=b.dataset.act;if(!a)return;
 const sw=(x,y)=>{[P.items[x],P.items[y]]=[P.items[y],P.items[x]];renderEd();schedPv()};
 if(a==='up')sw(i,i-1);else if(a==='dn')sw(i,i+1);
 else if(a==='del'){if(confirm('حذف هذا العنصر؟')){P.items.splice(i,1);renderEd();schedPv()}}
 else if(a==='dup'){P.items.splice(i+1,0,JSON.parse(JSON.stringify(P.items[i])));renderEd();schedPv()}
 else if(a==='addpage'){S.pages.push({cols:P.cols,items:[]});cur=S.pages.length-1;renderEd();schedPv()}
 else if(a==='dpage'){S.pages.splice(cur+1,0,JSON.parse(JSON.stringify(P)));cur++;renderEd();schedPv()}
 else if(a==='rmpage'){if(S.pages.length>1&&confirm('حذف الصفحة كلها؟')){S.pages.splice(cur,1);cur=Math.max(0,cur-1);renderEd();schedPv()}else if(S.pages.length<2)alert('لا يمكن حذف الصفحة الوحيدة')}
 else if(a==='pl'){[S.pages[cur-1],S.pages[cur]]=[S.pages[cur],S.pages[cur-1]];cur--;renderEd();schedPv()}
 else if(a==='pr'){[S.pages[cur+1],S.pages[cur]]=[S.pages[cur],S.pages[cur+1]];cur++;renderEd();schedPv()}
 else if(a==='pick'){imgTarget={t:'item',i};$('#fileImg').click()}
 else if(a==='rmimg'){P.items[i].img='';renderEd();schedPv()}
 else if(a==='pickcover'){imgTarget={t:'cover'};$('#fileImg').click()}
 else if(a==='rstcb'){S.meta.cb1='';S.meta.cb2='';renderDe();schedPv()}
 else if(a==='rmcover'){S.meta.coverImg='';renderDe();schedPv()}
 else if(a==='pickqr'){imgTarget={t:'qr'};$('#fileImg').click()}
 else if(a==='resetqr'){S.ft.qr=QR;schedPv();alert('تمت إعادة الرمز الأصلي')}
 else if(a==='addrow'){const r=P.items[i].rows;r.push(r[0].map(()=>''));renderEd();schedPv()}
 else if(a==='addcol'){P.items[i].rows.forEach(r=>r.push(''));renderEd();schedPv()}
 else if(a==='delrow'){const r=P.items[i].rows;if(r.length>1)r.pop();renderEd();schedPv()}
 else if(a==='delcol'){const r=P.items[i].rows;if(r[0].length>1)r.forEach(x=>x.pop());renderEd();schedPv()}
 else if(a==='fit')autoFit();
 else if(a==='bulk')bulkDlg()});
ed.addEventListener('change',e=>{if(e.target.dataset.o==='meta'&&e.target.dataset.k==='cover'){renderPv()}});
$('#fileImg').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f||!imgTarget)return;const d=await shrink(f,imgTarget.t==='qr'?600:1500);
 if(imgTarget.t==='item'){S.pages[cur].items[imgTarget.i].img=d;renderEd()}else if(imgTarget.t==='cover'){S.meta.coverImg=d;renderDe()}else{S.ft.qr=d}
 schedPv()});
function shrink(f,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);const x=c.getContext('2d');const png=/png|svg|gif|webp/.test(f.type);if(!png){x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height)}x.drawImage(im,0,0,c.width,c.height);res(c.toDataURL(png?'image/png':'image/jpeg',.88))};im.src=r.result};r.readAsDataURL(f)})}
/* ===== توزيع ===== */
function autoFit(){const m=document.createElement('div');m.style.cssText='position:fixed;left:-9999px;top:0;visibility:hidden';document.body.appendChild(m);
 let moved=0;for(let p=0;p<S.pages.length&&p<80;p++){m.innerHTML=sheetHTML(p);const bd=m.querySelector('.bd');const H=bd.clientHeight;const els=[...bd.querySelectorAll('.it')];let cut=-1;
  for(let i=0;i<els.length;i++){if(els[i].offsetTop+els[i].offsetHeight>H-14+0){cut=i;break}}
  if(cut>0){const rest=S.pages[p].items.splice(cut);let nx=S.pages[p+1];S.pages.splice(p+1,0,{cols:S.pages[p].cols,header:S.pages[p].header,items:rest});moved+=rest.length}}
 m.remove();renderEd();schedPv();alert(moved?'تم توزيع '+ad(moved)+' عنصر على صفحات جديدة.':'كل الصفحات تتسع لمحتواها.')}
function bulkDlg(){$('#modb').innerHTML=`<h3 style="margin:0 0 6px;color:#1e4f9e">إضافة أسئلة دفعة واحدة</h3><p class="hint">اكتب كل سؤال في سطر. لإضافة الإجابة ضع علامة | بعد السؤال. يمكنك لصق الأسئلة من أي مكان.</p><textarea id="bt" style="width:100%;min-height:150px;padding:8px;border:1px solid #c5cfdf;border-radius:8px" placeholder="ما إعراب كلمة (الطالبُ)؟ | فاعل مرفوع بالضمة"></textarea><div class="row" style="margin-top:8px"><div><label class="f">عدد الأسئلة في كل صفحة</label><input id="bn" type="number" min="1" max="30" value="6" style="width:100%;padding:8px;border:1px solid #c5cfdf;border-radius:8px"></div><div><label class="f">ترتيب الأسئلة</label><select id="bc" style="width:100%;padding:8px;border:1px solid #c5cfdf;border-radius:8px"><option value="2">عمودان</option><option value="1">عمود واحد</option></select></div></div><label class="f"><input type="checkbox" id="bh" checked> ضع عنوانًا فوق كل صفحة</label><input id="bht" type="text" value="أسئلة التدريب" style="width:100%;padding:8px;border:1px solid #c5cfdf;border-radius:8px"><div class="row" style="margin-top:10px"><button class="mini" id="bok" style="background:#17803a;color:#fff;padding:10px">أنشئ الصفحات</button><button class="mini" id="bno" style="padding:10px">إلغاء</button></div>`;$('#mod').classList.add('on');
 $('#bno').onclick=()=>$('#mod').classList.remove('on');
 $('#bok').onclick=()=>{const L=$('#bt').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!L.length)return;const n=Math.max(1,+$('#bn').value||6),cols=+$('#bc').value;const first=!S.pages[cur].items.length;
  for(let k=0;k<L.length;k+=n){const items=[];if($('#bh').checked)items.push({t:'h',text:$('#bht').value,num:'',col:'acc'});L.slice(k,k+n).forEach(s=>{const [q,a]=s.split('|');items.push({t:'q',text:q.trim(),ch:'',ans:(a||'').trim(),showAns:!!(a&&a.trim()),w:'auto',img:'',imgW:60,imgPos:'below',lines:0})});
   if(k===0&&first)Object.assign(S.pages[cur],{cols,items});else{S.pages.splice(cur+1+Math.floor(k/n)-(first?1:0),0,{cols,items})}}
  $('#mod').classList.remove('on');renderEd();schedPv()}}
/* ===== أعلى الصفحة ===== */
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>setTab(b.dataset.t));
function printNow(){const root=$('#printRoot');root.innerHTML=(S.meta.cover?sheetHTML('cover'):'')+S.pages.map((_,i)=>sheetHTML(i)).join('');(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>setTimeout(()=>window.print(),250))}
$('#bPdf').onclick=()=>{$('#modb').innerHTML=`<h3 style="margin:0 0 8px;color:#1e4f9e">تصدير PDF بجودة عالية</h3><p style="line-height:1.9;margin:0 0 8px">سيفتح لك نافذة الطباعة. اختر <b>حفظ كملف PDF</b> (أو Save as PDF) وحجم الورق <b>A4</b>، وأوقف خيار الرؤوس والتذييلات إن وجد، ثم احفظ.</p><p class="hint">على الآيفون: بعد ظهور المعاينة افتح مشاركة ثم احفظ في الملفات. الملف يخرج بخطوط متجهة حادة تصلح للطباعة.</p><div class="row"><button class="mini" id="pgo" style="background:#17803a;color:#fff;padding:10px">فتح نافذة الحفظ</button><button class="mini" id="pno" style="padding:10px">إلغاء</button></div>`;$('#mod').classList.add('on');$('#pno').onclick=()=>$('#mod').classList.remove('on');$('#pgo').onclick=()=>{$('#mod').classList.remove('on');printNow()}};
$('#bNew').onclick=()=>{if(confirm('بدء ملزمة جديدة؟ سيُمسح العمل الحالي، احفظ ملفك أولًا.')){S=sample();S.pages=[{cols:1,items:[]}];S.meta.cover=false;cur=0;renderEd();schedPv()}};
$('#bFile').onclick=()=>{$('#modb').innerHTML=`<h3 style="margin:0 0 8px;color:#1e4f9e">حفظ وفتح الملزمة</h3><p class="hint">الملزمة تُحفظ تلقائيًا على هذا الجهاز. لنسخة احتياطية أو لنقلها لجهاز آخر استخدم الملف.</p><div class="row"><button class="mini" id="jsv" style="padding:10px">تنزيل ملف الملزمة</button><button class="mini" id="jop" style="padding:10px">فتح ملف</button></div><div class="row" style="margin-top:8px"><button class="mini" id="jex" style="padding:10px">استرجاع المثال الجاهز</button><button class="mini" id="jno" style="padding:10px">إغلاق</button></div>`;$('#mod').classList.add('on');
 $('#jno').onclick=()=>$('#mod').classList.remove('on');
 $('#jsv').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S)],{type:'application/json'}));a.download='molzama.json';a.click()};
 $('#jop').onclick=()=>$('#fileJson').click();
 $('#jex').onclick=()=>{if(confirm('سيحل المثال محل العمل الحالي. متأكد؟')){S=sample();cur=0;$('#mod').classList.remove('on');renderEd();schedPv()}}};
$('#fileJson').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);norm();cur=0;$('#mod').classList.remove('on');renderEd();schedPv()}catch(x){alert('الملف غير صالح')}};r.readAsText(f);e.target.value=''});
$('#pv').addEventListener('click',e=>{const w=e.target.closest('.pvw');if(!w)return;const p=w.dataset.pv;if(p==='cover'){setTab('de');return}cur=+p;const it=e.target.closest('.it');setTab('ed');if(it){const c=ed.querySelector(`[data-card="${it.dataset.i}"]`);if(c){c.scrollIntoView({block:'center'});c.classList.add('flash');setTimeout(()=>c.classList.remove('flash'),1400)}}else renderPv()});
window.addEventListener('resize',()=>{clearTimeout(pvT);pvT=setTimeout(renderPv,200)});
load();norm();renderEd();(document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve()).then(()=>renderPv());renderPv();
</script>
</body>
</html>
