      o.type='sine';o.frequency.value=f;
      g.gain.setValueAtTime(0.0001,t+i*0.12);
      g.gain.linearRampToValueAtTime(0.16,t+i*0.12+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+i*0.12+0.4);
      o.connect(g);g.connect(ctx.destination);
      o.start(t+i*0.12);o.stop(t+i*0.12+0.45);
    });
  }catch(e){}
}
function showPop(html,ms,cb,ps){
  var pose=ps||(ms?'trophy':'waving');

  document.body.appendChild(o);
  chime();
  if(ms)setTimeout(function(){o.remove();if(cb)cb();},ms);
  return o;
}
var ROBOT='';

  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;

}

    dood('felucca','top:330px;left:6px;opacity:.5','var(--ink)',72)+
    dood('water','top:460px;right:8px;opacity:.5','var(--blue)',66)+
    dood('column','top:560px;left:14px;opacity:.5','var(--ink)',58)+
    dood('ankh','top:680px;right:20px;opacity:.5','var(--red)',46)+
    dood('scroll','top:790px;left:16px;opacity:.5','var(--ink)',56));
  paint();

  if(!S.seenIntro){

    S.seenIntro=true;save();
    o.querySelector('#introOk').onclick=function(){o.remove();};
  }
}
function explainHTML(list){
  return list.map(function(e,ix){
    if(e.b){var sx=(window.AR_SIMPLIFY||{})[e.b];return '<div class="card bk simp-c"'+(sx?' data-simp="'+e.b+'"':'')+'>'+D.B[e.b]+'</div>';}
    if(e.illus){var il=ILLUST[e.illus];return '<div class="illus">'+(il?il.svg:'')+(il&&il.cap?'<div class="il-cap">'+il.cap+'</div>':'')+'</div>';}
    return '<div class="frame'+(ix%2?' alt':'')+'"><img loading="lazy" src="'+IMG+e.img+'.jpg" onclick="zoom(this.src)" alt="من الدرس">'+(e.cap?'<div class="cap">'+e.cap+'</div>':'')+'</div>';
  }).join('');
}
function refHTML(ref){
  if(ref&&ref.img)return '<img loading="lazy" src="'+IMG+ref.img+'.jpg" onclick="zoom(this.src)">';
  var arr=Array.isArray(ref)?ref:[ref];
  return '<div class="bk">'+arr.map(function(k){return D.B[k];}).join('')+'</div>';
}
function mcqHTML(q,id,letters){
  var done=S.done[id];
  var h='<div class="q"><h3>'+q.q+'</h3>';
  h+=q.options.map(function(o,i){
    var cls='opt';
    if(done&&i===q.a)cls+=' ok';
    if(done&&done.picked===i&&i!==q.a)cls+=' no';
    return '<button class="'+cls+'" data-mq="'+id+'" data-i="'+i+'" '+(done?'disabled':'')+'><span class="k">'+letters[i]+'</span> '+o+(done&&i===q.a?' ✓':'')+'</button>';
  }).join('');
  if(done){
    if(done.picked===q.a)h+='<div class="feed ok"><img class="feed-ch" src="assets/img/mr-youssef-thumbsup.png" alt="">'+mmBubble("thumbsup","correct","c-"+id)+'</div>';
    else h+='<div class="feed no"><img class="feed-ch" src="assets/img/mr-youssef-thinking.png" alt="">'+mmBubble("notebook","wrong","w-"+id)+'</div>';
    if(q.why)h+='<details class="why"><summary>راجع الشرح</summary>'+refHTML(q.why)+'</details>';
  }
  return h+'</div>';
}
function openHTML(q,id){
  var done=S.done[id];
  var mod=q.mod?'<div class="mod">'+q.mod+'</div>':refHTML(q.ans);
  var h='<div class="q" id="'+id+'"><span class="src">'+q.src+'</span><h3>'+q.q+'</h3>';
  if(!done){
    h+='<textarea id="ta-'+id+'" placeholder="اكتب إجابتك هنا أولًا…"></textarea>';
    h+='<button class="btn btn-reveal" data-rev="'+id+'">اعرض نموذج الإجابة</button>';
    h+='<div class="ans" id="ans-'+id+'" hidden><div class="h"><img class="feed-ch" src="assets/img/mr-youssef-pointup.png" alt="" style="height:44px;width:auto;display:inline-block;vertical-align:-14px;margin:-12px 0 -8px 4px">نموذج الإجابة — قارنها بما كتبت</div>'+mod+'</div>';
    h+='<button class="btn btn-done" data-ok="'+id+'" hidden id="ok-'+id+'">✓ راجعت إجابتي</button>';
  }else{
    h+='<div class="feed ok">تمت المراجعة ✓</div>';
    h+='<details class="why"><summary>نموذج الإجابة</summary>'+mod+'</details>';
  }
  return h+'</div>';
}
function segIds(i){
  var sg=LES.segments[i],base=0;
  for(var j=0;j<i;j++)base+=LES.segments[j].questions.length;
  var ids=(sg.check||[]).map(function(_,k){return 'c'+i+'_'+k;});
  return ids.concat(sg.questions.map(function(_,k){return 'q'+(base+k);}));
}
var SIMP_AV='<img src="assets/img/mr-youssef-book.png" alt="" style="width:100%;height:100%;object-fit:contain">';
var SIMP_AV_SM='<img src="assets/img/mr-youssef-book.png" alt="" style="width:22px;height:22px;object-fit:cover;object-position:50% 15%;vertical-align:-5px">';
function simpOff(){try{return localStorage.getItem('ar1-simp-off')==='1';}catch(e){return false;}}
function simpModeLabel(){return simpOff()?'تشغيل الظهور التلقائي':'إيقاف الظهور التلقائي';}
var POSES={pointing:'assets/img/mr-youssef-pointup.png',waving:'assets/img/mr-youssef-wave.png'};
function simpPose(){var k=localStorage.getItem('ar1-simp-met')?'pointing':'waving';localStorage.setItem('ar1-simp-met','1');return POSES[k];}
function hideSimp(){
  var bub=window.__cw;
  if(!bub)return;
  bub.hidden=true;clearTimeout(showSimp.t);
}
function showSimp(id,manual){
  var txt=(window.AR_SIMPLIFY||{})[id];if(!txt)return;
  var bub=window.__cw;
  var card=document.querySelector('[data-simp="'+id+'"]');
  if(card&&bub)bub=card.after(bub)||bub;
  document.getElementById('chFig').src=simpPose();
  document.getElementById('sbTxt').textContent=txt;
  document.getElementById('sbMode').textContent=simpModeLabel();
  bub.hidden=false;
  try{bub.scrollIntoView({behavior:'smooth',block:'nearest'});}catch(e){}
  clearTimeout(showSimp.t);
  showSimp.t=setTimeout(hideSimp,manual?12000:8000);
}
document.getElementById('sbX').onclick=hideSimp;
document.getElementById('sbMode').onclick=function(){
  try{localStorage.setItem('ar1-simp-off',simpOff()?'0':'1');}catch(e){}
  this.textContent=simpModeLabel();
};
function setupSimp(m){
  var cw=window.__cw||(window.__cw=document.getElementById('charWrap'));
  if(cw&&!cw.isConnected)document.body.appendChild(cw);
  hideSimp();
  if(setupSimp.io){setupSimp.io.disconnect();setupSimp.io=null;}
  if(S.sub!==0)return;
  var els=m.querySelectorAll('[data-simp]');
  els.forEach(function(el){
    var ch=el.querySelector('.simp-chip');
    if(ch)ch.onclick=function(ev){ev.stopPropagation();showSimp(el.dataset.simp,true);};
  });
  setupSimp.io=new IntersectionObserver(function(en){
    en.forEach(function(x){if(x.isIntersecting&&!simpOff())showSimp(x.target.dataset.simp,false);});
  },{threshold:0.65});
  els.forEach(function(el){setupSimp.io.observe(el);});
}
function cheerFor(seg){
  if(seg>=LES.segments.length-2)return 'هانت! فاضل خطوة وتخلص الدرس';
  if(seg>=5)return 'كمل يا بطل! عديت النص';
  if(seg>=2)return 'كمل، شغلك حلو';
  return 'عاش يا بطل! بداية جامدة';
}
function starify(m){
  m.querySelectorAll('.bk .rh').forEach(function(r){
    if(!r.querySelector('.rh-star'))r.insertAdjacentHTML('afterbegin','<span class="rh-star">'+ST+'</span>');
  });
}
function renderLesson(){
  document.getElementById('mbar').hidden=true;
  var m=document.getElementById('main');
  if(S.seg>=LES.segments.length){
    m.innerHTML='<div class="done-screen"><img class="done-ch" src="assets/img/mr-youssef-celebrating.png" alt="مستر يوسف"><div class="big"><svg viewBox="0 0 64 64" width="72" height="72"><circle cx="32" cy="32" r="29" fill="none" stroke="var(--green)" stroke-width="4"/><path d="M20 33l8 8 16-18" fill="none" stroke="var(--ink)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>'+mmBubble("trophy","done","d")+'</h2><p>أنهيت «'+LES.title.split(':')[0]+'»: قرأت الشرح كاملًا وأجبت على '+ar(totals().b)+' سؤالًا و'+ar(totals().c)+' سؤال فهم سريع.<br>انتقل إلى الدرس التالي من زر «الدروس» أسفل الشاشة.</p></div><div class="navrow"><button class="next" id="toMap">العودة للخريطة ◂</button></div>';
    paint();chime();window.scrollTo(0,0);
    document.getElementById('toMap').onclick=function(){S.view='map';S.seg=LES.segments.length-1;S.sub=1;save();render();};
    return;
  }
  var sg=LES.segments[S.seg];
  var base=0;for(var i=0;i<S.seg;i++)base+=LES.segments[i].questions.length;
  var h='<div class="seg-label"><span class="n">'+ar(S.seg+1)+'/'+ar(LES.segments.length)+'</span> '+sg.label+' — '+(S.sub===0?'الشرح':'الأسئلة')+'</div>';
  if(S.sub===0){
    h+=explainHTML(sg.explain);
  }else{
    var letters=['أ','ب','ج','د'];
    if(sg.check&&sg.check.length){
      h+='<div class="sec-h"><img class="sec-ch" src="assets/img/mr-youssef-pointup.png" alt="">أسئلة سريعة على ما قرأته</div>';
      h+=sg.check.map(function(q,i){return mcqHTML(q,'c'+S.seg+'_'+i,q.options.length===2?['صح','خطأ']:letters);}).join('');
    }
    if(sg.questions.length){
      h+='<div class="sec-h"><img class="sec-ch" src="assets/img/mr-youssef-encouraging.png" alt="">أسئلة الدرس</div>';
      h+=sg.questions.map(function(q,i){
        var id='q'+(base+i);
        return q.t==='mcq'?mcqHTML(q,id,letters):openHTML(q,id);
      }).join('');
    }
  }
  var allDone=segIds(S.seg).every(function(id){return S.done[id];});
  var isLast=(S.seg===LES.segments.length-1&&S.sub===1);
  h+='<div class="lock">'+(S.sub===1&&!allDone?'أجب على كل الأسئلة لفتح الجزء التالي':'')+'</div>';
  m.innerHTML=h;starify(m);paint();window.scrollTo(0,0);setupSimp(m);
  var mb=document.getElementById('mbar');mb.hidden=false;
  var nb=document.getElementById('nextBtn');
  nb.innerHTML=S.sub===0?'انتقل للأسئلة ◂':(isLast?'إنهاء الدرس':'الجزء التالي ◂');
  nb.disabled=(S.sub===1&&!allDone);
  m.querySelectorAll('[data-mq]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.mq]={picked:+b.dataset.i};save();render();
    var el=b.closest('.q');if(el)el.scrollIntoView({behavior:'smooth',block:'center'});
  };});
  m.querySelectorAll('[data-rev]').forEach(function(b){b.onclick=function(){
    var id=b.dataset.rev;
    document.getElementById('ans-'+id).hidden=false;
    document.getElementById('ok-'+id).hidden=false;
    b.hidden=true;
  };});
  m.querySelectorAll('[data-ok]').forEach(function(b){b.onclick=function(){
    S.done[b.dataset.ok]={open:true};save();render();
  };});
  document.getElementById('prevBtn').onclick=function(){
    if(S.sub===1){S.sub=0;}
    else{S.view='map';}
    save();render();
  };
  document.getElementById('nextBtn').onclick=function(){
    var nb=this;if(nb.disabled)return;
    if(S.sub===0){S.sub=1;save();render();return;}
    var finishedSeg=S.seg;
    S.seg++;S.sub=0;save();
    showPop('<div class="pop-h">'+ROBOT+'<span>'+cheerFor(finishedSeg)+'</span></div>',1500,function(){render();});
  };
}
function renderList(){
  document.getElementById('mbar').hidden=true;
  var m=document.getElementById('main');
  var CHK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12.5 l5 5 L20 6.5"/></svg>';
  var LOCK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="10.5" width="14" height="9.5" rx="2.5"/><path d="M8 10.5 V7.8 a4 4 0 0 1 8 0 v2.7"/></svg>';
  var offs=[0,-56,28,-28,56,0];
  var h='<div class="path">';
  var openUnits=true,foundHere=false,oi=0;
  D.stages.forEach(function(st){
    var ls=D.lessons.map(function(l,i){return {l:l,i:i};}).filter(function(x){return x.l.stage===st.id;});
    if(!ls.length)return;
    if(!openUnits){
      h+='<div class="ubanner locked"><h2>'+LOCK+' الوحدة '+ar(st.n)+': '+st.title+'</h2><p>هتظهر دروسها هنا أول ما تخلّص اللي قبلها</p></div>';
      return;
    }
    h+='<div class="ubanner"><h2>الوحدة '+ar(st.n)+': '+st.title+'</h2></div>';
    var unitDone=ls.every(function(x){return lessonPc(x.l)===100;});
    ls.forEach(function(x){
      var pc=lessonPc(x.l),done=pc===100;
      var here=!done&&!foundHere;if(here)foundHere=true;
      var cls=done?'done':(here?'here':'');
      var inner=done?CHK:ar(x.i+1);
      h+='<div class="pnode '+cls+'" style="transform:translateX('+offs[oi++%6]+'px)">';
      h+='<button class="c" data-l="'+(x.i+1)+'">'+inner+'</button>';
      if(here)h+='<span class="heretag">أنت هنا</span>';
      h+='<div class="t">'+x.l.title+'</div></div>';
    });
    openUnits=unitDone;
  });
  h+='</div>';
  m.innerHTML=h;
  m.querySelectorAll('[data-l]').forEach(function(b){b.onclick=function(){location.href='lesson.html?t='+TRK+'&lesson='+b.dataset.l;};});
  paintAll();
}
function backBtn(){
  var b=document.getElementById('backBtn');
  if(!LES){b.onclick=function(){location.href='track.html?t='+TRK;};return;}
  if(S.view==='map'){b.onclick=function(){location.href='track.html?t='+TRK;};}
  else{b.onclick=function(){S.view='map';save();render();};}
}
function render(){
  if(!LES){renderList();backBtn();return;}
  if(S.view==='map')renderMap();else renderLesson();
  backBtn();
}
render();
var _nt=document.getElementById('nTitle');if(_nt){_nt.addEventListener('click',function(){backBtn();});}
